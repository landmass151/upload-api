name: Remote upload

on:
  workflow_dispatch:
    inputs:
      api:
        description: "API à utiliser"
        required: true
        type: choice
        options:
          - gofile
          - fileditch
          - multiup
        default: gofile

      source_urls:
        description: >-
          URLs directes séparées par des espaces.
          Exemple : https://site.test/a.zip https://site.test/b.iso
        required: true
        type: string

      filename:
        description: >-
          Noms personnalisés optionnels, dans le même ordre que les URL.
          Entourer les noms contenant des espaces avec des guillemets.
          Utiliser <echap> pour détecter automatiquement le nom depuis l'URL.
          Exemple : "mon fichier.zip" <echap> image.iso.
          Si moins de noms sont fournis, les noms restants sont détectés
          depuis les URL. Si plus de noms sont fournis, le workflow s'arrête.
        required: false
        type: string

      escape:
        description: >-
          Active l'utilisation de <echap> pour ignorer un nom personnalisé
          et détecter automatiquement le nom depuis l'URL.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  upload:
    name: Upload vers ${{ inputs.api }}
    runs-on: ubuntu-latest

    outputs:
      file_url: ${{ steps.upload.outputs.file_url }}
      file_urls: ${{ steps.upload.outputs.file_urls }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances Python
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check requests tqdm

      - name: Vérifier Python et curl
        run: |
          python --version
          curl --version

      - name: Envoyer les fichiers
        id: upload
        shell: bash
        env:
          API: ${{ inputs.api }}
          SOURCE_URLS: ${{ inputs.source_urls }}
          CUSTOM_FILENAMES: ${{ inputs.filename }}
          ENABLE_ESCAPE: ${{ inputs.escape }}

          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
          GOFILE_FOLDER_ID: ${{ secrets.GOFILE_FOLDER_ID }}

          MULTIUP_USERNAME: ${{ secrets.MULTIUP_USERNAME }}
          MULTIUP_PASSWORD: ${{ secrets.MULTIUP_PASSWORD }}

        run: |
          set -euo pipefail

          command=(
            python scripts/remote_upload.py
            --api "$API"
            --source-urls "$SOURCE_URLS"
          )

          if [ -n "$CUSTOM_FILENAMES" ]; then
            command+=(
              --filenames
              "$CUSTOM_FILENAMES"
            )
          fi

          if [ "$ENABLE_ESCAPE" = "true" ]; then
            command+=(--escape)
          fi

          "${command[@]}"

      - name: Afficher les liens finaux
        if: success()
        shell: bash
        env:
          FILE_URLS: ${{ steps.upload.outputs.file_urls }}

        run: |
          echo "Liens générés :"
          printf '%s\n' "$FILE_URLS"

          {
            echo "## Uploads terminés"
            echo
            echo "- API utilisée : \`${{ inputs.api }}\`"
            echo
            echo '```text'
            printf '%s\n' "$FILE_URLS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
