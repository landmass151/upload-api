name: Upload API
# Le fichier est situé à l’emplacement suivant :
# .github/workflows/upload-api.yml
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution"
        required: true
        type: choice
        default: archive
        options:
          - archive
          - desarchive
          - re-upload

      api:
        description: "API à utiliser"
        required: true
        type: choice
        default: gofile
        options:
          - gofile
          - fileditch
          - multiup

      source_urls:
        description: >-
          En mode archive : une ou plusieurs URLs séparées par des espaces.
          En mode desarchive : une seule URL d'archive.
          En mode re-upload : une ou plusieurs URLs séparées par des espaces.
        required: true
        type: string

      filename:
        description: >-
          En mode archive : nom personnalisé du ZIP final.
          En mode re-upload : noms personnalisés séparés par des espaces,
          dans le même ordre que les URLs.
        required: false
        type: string

      escape:
        description: >-
          Utilise <echap> pour conserver le nom détecté automatiquement.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  upload:
    name: Upload vers ${{ inputs.api }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer les outils système
        if: ${{ inputs.mode == 'desarchive' }}
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            p7zip-full \
            unrar-free \
            unzip \
            tar

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances Python
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            --upgrade \
            pip

          python -m pip install \
            --disable-pip-version-check \
            requests \
            tqdm

      - name: Vérifier les outils
        run: |
          set -euo pipefail

          python --version
          curl --version

          if [ "${{ inputs.mode }}" = "desarchive" ]; then
            7z
            unzip -v
            tar --version
          fi

      - name: Télécharger et envoyer les fichiers
        id: upload
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          API: ${{ inputs.api }}
          SOURCE_URLS: ${{ inputs.source_urls }}
          CUSTOM_FILENAMES: ${{ inputs.filename }}
          ENABLE_ESCAPE: ${{ inputs.escape }}

          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
          GOFILE_FOLDER_ID: ${{ secrets.GOFILE_FOLDER_ID }}

          MULTIUP_USERNAME: ${{ secrets.MULTIUP_USERNAME }}
          MULTIUP_PASSWORD: ${{ secrets.MULTIUP_PASSWORD }}

        run: |
          set -euo pipefail

          case "$API" in
            gofile)
              SCRIPT="scripts/upload-gofile.py"
              ;;

            fileditch)
              SCRIPT="scripts/upload-fileditch.py"
              ;;

            multiup)
              SCRIPT="scripts/upload-multiup.py"
              ;;

            *)
              echo "API inconnue : $API" >&2
              exit 1
              ;;
          esac

          command=(
            python "$SCRIPT"
            --mode "$MODE"
            --source-urls "$SOURCE_URLS"
          )

          if [ -n "$CUSTOM_FILENAMES" ]; then
            command+=(
              --filenames
              "$CUSTOM_FILENAMES"
            )
          fi

          if [ "$ENABLE_ESCAPE" = "true" ]; then
            command+=(--escape)
          fi

          echo "Script utilisé : $SCRIPT"

          "${command[@]}"

      - name: Afficher les liens générés
        if: success()
        shell: bash
        env:
          FILE_URLS: ${{ steps.upload.outputs.file_urls }}

        run: |
          set -euo pipefail

          echo "Liens générés :"
          printf '%s\n' "$FILE_URLS"

          {
            echo "## Uploads terminés"
            echo
            echo "- Mode : \`${{ inputs.mode }}\`"
            echo "- API : \`${{ inputs.api }}\`"
            echo
            echo '```text'
            printf '%s\n' "$FILE_URLS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
